name: Video Server Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Cz05180921.
          MYSQL_DATABASE: video_server_test
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Install dependencies
      run: go mod tidy

    - name: Initialize database
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -pCz05180921. video_server_test < docker/mysql/init.sql

    - name: Build services
      run: ./build.sh

    - name: Run API server in background
      run: |
        DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root DB_PASSWORD=Cz05180921. DB_NAME=video_server_test ./bin/api-server &
        sleep 5

    - name: Run comprehensive API tests
      run: |
        # Wait for server to be ready
        curl -f http://localhost:8080/health || exit 1
        
        echo "=== Starting Comprehensive API Tests ==="
        
        # 1. Health check test
        echo "1. Testing health check..."
        curl -X GET http://localhost:8080/health | jq .
        
        # 2. User registration test
        echo "2. Testing user registration..."
        REGISTER_RESPONSE=$(curl -s -X POST http://localhost:8080/api/v1/users/register \
          -H "Content-Type: application/json" \
          -d '{"username": "testuser_github", "password": "TestPass123"}')
        echo $REGISTER_RESPONSE | jq .
        
        # Extract token and user info
        TOKEN=$(echo $REGISTER_RESPONSE | jq -r '.token')
        USER_ID=$(echo $REGISTER_RESPONSE | jq -r '.user_id')
        
        # 3. User login test
        echo "3. Testing user login..."
        LOGIN_RESPONSE=$(curl -s -X POST http://localhost:8080/api/v1/users/login \
          -H "Content-Type: application/json" \
          -d '{"username": "testuser_github", "password": "TestPass123"}')
        echo $LOGIN_RESPONSE | jq .
        
        # Update token
        TOKEN=$(echo $LOGIN_RESPONSE | jq -r '.token')
        
        # 4. Get user profile test
        echo "4. Testing get user profile..."
        curl -X GET http://localhost:8080/api/v1/users/profile \
          -H "Authorization: Bearer $TOKEN" | jq .
        
        # 5. Video upload test
        echo "5. Testing video upload..."
        echo "Test video content for GitHub Actions" > test_video.txt
        UPLOAD_RESPONSE=$(curl -s -X POST http://localhost:8080/api/v1/videos/upload \
          -H "Authorization: Bearer $TOKEN" \
          -F "file=@test_video.txt" \
          -F "name=Test Video from GitHub Actions")
        echo $UPLOAD_RESPONSE | jq .
        
        # Extract video ID
        VIDEO_ID=$(echo $UPLOAD_RESPONSE | jq -r '.video_id')
        
        # 6. Get user videos test
        echo "6. Testing get user videos..."
        curl -X GET http://localhost:8080/api/v1/users/videos \
          -H "Authorization: Bearer $TOKEN" | jq .
        
        # 7. Get video info test
        echo "7. Testing get video info..."
        curl -X GET http://localhost:8080/api/v1/videos/$VIDEO_ID \
          -H "Authorization: Bearer $TOKEN" | jq .
        
        # 8. Add comment test
        echo "8. Testing add comment..."
        COMMENT_RESPONSE=$(curl -s -X POST http://localhost:8080/api/v1/videos/$VIDEO_ID/comments \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"content": "This is a test comment from GitHub Actions workflow!"}')
        echo $COMMENT_RESPONSE | jq .
        
        # Extract comment ID
        COMMENT_ID=$(echo $COMMENT_RESPONSE | jq -r '.comment_id')
        
        # 9. Get comments test
        echo "9. Testing get comments..."
        curl -X GET http://localhost:8080/api/v1/videos/$VIDEO_ID/comments \
          -H "Authorization: Bearer $TOKEN" | jq .
        
        # 10. Get single comment test
        echo "10. Testing get single comment..."
        curl -X GET http://localhost:8080/api/v1/comments/$COMMENT_ID \
          -H "Authorization: Bearer $TOKEN" | jq .
        
        echo "=== All tests completed successfully! ==="

    - name: Test cleanup
      if: always()
      run: |
        # Kill the API server
        pkill api-server || true
        # Clean up test files
        rm -f test_video.txt