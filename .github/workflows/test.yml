name: Video Server Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

# CI 专用的一次性口令；作业级 env 里可用仓库 Secret 覆盖（见 api / e2e 作业）
env:
  CI_DB_PASSWORD: ci-only-throwaway
  CI_JWT_SECRET: ci-only-jwt-secret-at-least-32-characters

jobs:
  backend:
    name: Go 格式 / 静态检查 / 单元测试
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: gofmt 检查
      run: |
        unformatted=$(gofmt -l ./cmd ./internal ./pkg)
        if [ -n "$unformatted" ]; then
          echo "::error::以下文件未通过 gofmt，请执行 make fmt"
          echo "$unformatted"
          exit 1
        fi

    - name: 校验 go.mod / go.sum 已整理
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: go build / go vet / go test
      run: |
        go build ./...
        go vet ./...
        go test ./...

    - name: 依赖漏洞扫描（govulncheck）
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

    - name: 校验 Prometheus 告警规则
      run: |
        docker run --rm \
          -v "$PWD/deploy/monitoring:/rules:ro" \
          --entrypoint promtool \
          prom/prometheus:v2.40.0 check rules /rules/alerts.yml

    - name: 校验 Alertmanager 配置
      run: |
        docker run --rm \
          --entrypoint amtool \
          -v "$PWD/deploy/monitoring:/cfg:ro" \
          prom/alertmanager:v0.34.1 check-config /cfg/alertmanager.yml

  api:
    name: API 集成测试
    runs-on: ubuntu-latest
    env:
      CI_DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'ci-only-throwaway' }}
      CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-only-jwt-secret-at-least-32-characters' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'ci-only-throwaway' }}
          MYSQL_DATABASE: video_server_test
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: 构建服务
      run: ./build.sh

    - name: 安装 ffmpeg（转码链路测试需要）
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg
        ffmpeg -version | head -1

    - name: 应用数据库迁移并校验模型一致性
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: "3306"
        DB_USER: root
        DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'ci-only-throwaway' }}
        DB_NAME: video_server_test
      run: |
        ./bin/migrate up
        ./bin/migrate check

    - name: 运行 API 集成测试
      run: |
        DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root \
          DB_PASSWORD="$CI_DB_PASSWORD" DB_NAME=video_server_test \
          JWT_SECRET="$CI_JWT_SECRET" \
          ./bin/api-server > /tmp/api-server.log 2>&1 &

        for i in $(seq 1 30); do
          curl -fs http://localhost:8080/health > /dev/null && break
          sleep 1
        done
        curl -fs http://localhost:8080/health || { echo "API server 未就绪"; cat /tmp/api-server.log; exit 1; }

        # 上传后视频处于 processing，需由 worker 转码完成才会变为 active
        mkdir -p storage/videos storage/temp
        DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root \
          DB_PASSWORD="$CI_DB_PASSWORD" DB_NAME=video_server_test \
          REDIS_ADDR=127.0.0.1:6379 \
          STORAGE_VIDEO_DIR=./storage/videos STORAGE_TEMP_DIR=./storage/temp \
          ./bin/transcode-worker > /tmp/transcode-worker.log 2>&1 &

        # test-api.sh 使用仓库内的 testdata/sample.mp4 固件，不依赖外网下载
        ./test-api.sh

    - name: 失败时输出服务日志
      if: failure()
      run: |
        cat /tmp/api-server.log || true
        cat /tmp/transcode-worker.log || true

    - name: 清理
      if: always()
      run: |
        pkill api-server || true
        pkill transcode-worker || true
        rm -f /tmp/video_test/test_video.mp4

  frontend:
    name: 前端 lint / 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-new
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-new/package-lock.json

    - run: npm ci
    - run: npm run lint
    - run: npx vitest run
    - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: 前端 e2e（Playwright / Chromium）
    runs-on: ubuntu-latest
    env:
      CI_DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'ci-only-throwaway' }}
      CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-only-jwt-secret-at-least-32-characters' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'ci-only-throwaway' }}
          MYSQL_DATABASE: video_server_test
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-new/package-lock.json

    - name: 构建服务
      run: ./build.sh

    - name: 应用数据库迁移并校验模型一致性
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: "3306"
        DB_USER: root
        DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'ci-only-throwaway' }}
        DB_NAME: video_server_test
      run: |
        ./bin/migrate up
        ./bin/migrate check

    - name: 后台启动 API server
      run: |
        DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root \
          DB_PASSWORD="$CI_DB_PASSWORD" DB_NAME=video_server_test \
          JWT_SECRET="$CI_JWT_SECRET" \
          ./bin/api-server > /tmp/api-server.log 2>&1 &

        for i in $(seq 1 30); do
          curl -fs http://localhost:8080/health > /dev/null && break
          sleep 1
        done
        curl -fs http://localhost:8080/health || { echo "API server 未就绪"; cat /tmp/api-server.log; exit 1; }

    - name: 安装前端依赖与 Chromium
      working-directory: frontend-new
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: 运行 e2e（Playwright 会自行拉起 vite 开发服务器）
      working-directory: frontend-new
      run: npx playwright test --project=chromium

    - name: 失败时上传报告
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend-new/playwright-report
        retention-days: 7
