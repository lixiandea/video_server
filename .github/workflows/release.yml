name: Production Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA to deploy
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: video-server-api
            dockerfile: Dockerfile.apiserver
            context: .
          - image: video-server-scheduler
            dockerfile: Dockerfile.scheduler
            context: .
          - image: video-server-worker
            dockerfile: Dockerfile.transcode-worker
            context: .
          - image: video-server-migrate
            dockerfile: Dockerfile.migrate
            context: .
          - image: video-server-admin
            dockerfile: Dockerfile.admin
            context: .
          - image: video-server-frontend
            dockerfile: Dockerfile.frontend.nginx
            context: frontend-new
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          sbom: true
          provenance: mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.image_tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload release files
        run: |
          rsync -az \
            docker-compose.prod.yml .env.production.example deploy/monitoring deploy/production scripts \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/video-server/"

      - name: Migrate and deploy
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ssh "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "cd /opt/video-server && IMAGE_TAG='$IMAGE_TAG' ./scripts/deploy-production.sh"
