name: video-server

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app-security: &app-security
  restart: always
  read_only: true
  tmpfs:
    - /tmp:size=1g,mode=1777
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  admin:
    image: ${REGISTRY}/video-server-admin:${IMAGE_TAG}
    profiles: [tools]
    secrets: [db_password, db_ca, admin_password]
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-25060}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-video_server}
      DB_TLS_CA_PATH: /run/secrets/db_ca
      DB_LOG_LEVEL: warn
      DB_MAX_OPEN_CONNS: "5"
      DB_MAX_IDLE_CONNS: "2"
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    networks: [private]
    logging: *default-logging

  migrate:
    image: ${REGISTRY}/video-server-migrate:${IMAGE_TAG}
    restart: "no"
    secrets: [db_password, db_ca]
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-25060}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-video_server}
      DB_TLS_CA_PATH: /run/secrets/db_ca
      DB_LOG_LEVEL: warn
      DB_MAX_OPEN_CONNS: "10"
      DB_MAX_IDLE_CONNS: "3"
    networks: [private]
    logging: *default-logging

  api-server:
    <<: *app-security
    image: ${REGISTRY}/video-server-api:${IMAGE_TAG}
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - db_password
      - db_ca
      - redis_password
      - redis_ca
      - jwt_secret
      - metrics_token
      - s3_access_key
      - s3_secret_key
      - s3_backup_access_key
      - s3_backup_secret_key
    environment:
      APP_ENV: production
      GIN_MODE: release
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-25060}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-video_server}
      DB_TLS_CA_PATH: /run/secrets/db_ca
      DB_LOG_LEVEL: warn
      DB_MAX_OPEN_CONNS: "50"
      DB_MAX_IDLE_CONNS: "10"
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_TLS_ENABLED: "true"
      REDIS_TLS_CA_PATH: /run/secrets/redis_ca
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      ACCESS_TOKEN_TTL: "900"
      REFRESH_TOKEN_TTL: "2592000"
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_DOMAIN: ${APP_DOMAIN}
      STREAM_TOKEN_TTL: "900"
      VIDEO_MODERATION_REQUIRED: "true"
      USER_VIDEO_QUOTA: "100"
      USER_STORAGE_QUOTA_BYTES: "10737418240"
      USER_DAILY_UPLOAD_LIMIT: "20"
      TRUSTED_PROXIES: "172.30.0.0/24"
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      STORAGE_BACKEND: s3
      STORAGE_TEMP_DIR: /tmp/video-server
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-nyc3}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_USE_SSL: "true"
      S3_BACKUP_ENDPOINT: ${S3_BACKUP_ENDPOINT}
      S3_BACKUP_REGION: ${S3_BACKUP_REGION:-sfo3}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET}
      S3_BACKUP_ACCESS_KEY_FILE: /run/secrets/s3_backup_access_key
      S3_BACKUP_SECRET_KEY_FILE: /run/secrets/s3_backup_secret_key
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [private]
    mem_limit: 1g
    cpus: 1.5

  scheduler:
    <<: *app-security
    image: ${REGISTRY}/video-server-scheduler:${IMAGE_TAG}
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - db_password
      - db_ca
      - redis_password
      - redis_ca
      - metrics_token
      - s3_access_key
      - s3_secret_key
      - s3_backup_access_key
      - s3_backup_secret_key
    environment:
      GIN_MODE: release
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-25060}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-video_server}
      DB_TLS_CA_PATH: /run/secrets/db_ca
      DB_LOG_LEVEL: warn
      DB_MAX_OPEN_CONNS: "10"
      DB_MAX_IDLE_CONNS: "3"
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_TLS_ENABLED: "true"
      REDIS_TLS_CA_PATH: /run/secrets/redis_ca
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      AUDIT_RETENTION_DAYS: "30"
      STORAGE_BACKEND: s3
      STORAGE_TEMP_DIR: /tmp/video-server
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-nyc3}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_USE_SSL: "true"
      S3_BACKUP_ENDPOINT: ${S3_BACKUP_ENDPOINT}
      S3_BACKUP_REGION: ${S3_BACKUP_REGION:-sfo3}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET}
      S3_BACKUP_ACCESS_KEY_FILE: /run/secrets/s3_backup_access_key
      S3_BACKUP_SECRET_KEY_FILE: /run/secrets/s3_backup_secret_key
    networks: [private]
    mem_limit: 512m
    cpus: 0.5

  transcode-worker:
    <<: *app-security
    image: ${REGISTRY}/video-server-worker:${IMAGE_TAG}
    depends_on:
      worker-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    secrets:
      - db_password
      - db_ca
      - redis_password
      - redis_ca
      - s3_access_key
      - s3_secret_key
      - s3_backup_access_key
      - s3_backup_secret_key
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-25060}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-video_server}
      DB_TLS_CA_PATH: /run/secrets/db_ca
      DB_LOG_LEVEL: warn
      DB_MAX_OPEN_CONNS: "20"
      DB_MAX_IDLE_CONNS: "5"
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_TLS_ENABLED: "true"
      REDIS_TLS_CA_PATH: /run/secrets/redis_ca
      TRANSCODE_CONCURRENCY: "2"
      TRANSCODE_MAX_RETRIES: "3"
      TRANSCODE_VISIBILITY_TIMEOUT: 30m
      TRANSCODE_RECLAIM_INTERVAL: 1m
      VIDEO_MODERATION_REQUIRED: "true"
      MALWARE_SCAN_ENABLED: "true"
      CLAMAV_HOST: tcp://clamav:3310
      STORAGE_BACKEND: s3
      STORAGE_TEMP_DIR: /tmp/video-server
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-nyc3}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_USE_SSL: "true"
      S3_BACKUP_ENDPOINT: ${S3_BACKUP_ENDPOINT}
      S3_BACKUP_REGION: ${S3_BACKUP_REGION:-sfo3}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET}
      S3_BACKUP_ACCESS_KEY_FILE: /run/secrets/s3_backup_access_key
      S3_BACKUP_SECRET_KEY_FILE: /run/secrets/s3_backup_secret_key
    networks: [private]
    volumes:
      - worker_temp:/tmp/video-server
    mem_limit: 4g
    cpus: 2.0

  worker-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /tmp/video-server && chmod 700 /tmp/video-server"]
    volumes:
      - worker_temp:/tmp/video-server
    logging: *default-logging

  frontend:
    image: ${REGISTRY}/video-server-frontend:${IMAGE_TAG}
    restart: always
    depends_on:
      api-server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /var/cache/nginx:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks: [private]
    mem_limit: 256m
    cpus: 0.5

  caddy:
    image: caddy:2.10-alpine
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    secrets: [origin_cert, origin_key]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, private]
    logging: *default-logging
    mem_limit: 256m

  clamav:
    image: clamav/clamav:stable_base
    restart: always
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [private]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    mem_limit: 2g
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.40.0
    restart: always
    secrets: [metrics_token]
    volumes:
      - ./deploy/monitoring/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    networks: [private]
    logging: *default-logging
    mem_limit: 1g

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: always
    secrets: [smtp_password]
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'SMTP_PASSWORD=$$(cat /run/secrets/smtp_password); sed -e "s|__SMTP_PASSWORD__|$$SMTP_PASSWORD|g" -e "s|__ALERT_EMAIL_TO__|$$ALERT_EMAIL_TO|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager'
    networks: [private]
    logging: *default-logging
    mem_limit: 256m

  grafana:
    image: grafana/grafana:9.3.0
    restart: always
    secrets: [grafana_admin_password]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/monitoring/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./deploy/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    networks: [private]
    logging: *default-logging
    mem_limit: 512m

networks:
  edge:
  private:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  worker_temp:
  clamav_data:

secrets:
  db_password:
    file: ${SECRETS_DIR:-./secrets}/db_password
  db_ca:
    file: ${SECRETS_DIR:-./secrets}/db_ca.pem
  redis_password:
    file: ${SECRETS_DIR:-./secrets}/redis_password
  redis_ca:
    file: ${SECRETS_DIR:-./secrets}/redis_ca.pem
  jwt_secret:
    file: ${SECRETS_DIR:-./secrets}/jwt_secret
  metrics_token:
    file: ${SECRETS_DIR:-./secrets}/metrics_token
  s3_access_key:
    file: ${SECRETS_DIR:-./secrets}/s3_access_key
  s3_secret_key:
    file: ${SECRETS_DIR:-./secrets}/s3_secret_key
  s3_backup_access_key:
    file: ${SECRETS_DIR:-./secrets}/s3_backup_access_key
  s3_backup_secret_key:
    file: ${SECRETS_DIR:-./secrets}/s3_backup_secret_key
  smtp_password:
    file: ${SECRETS_DIR:-./secrets}/smtp_password
  grafana_admin_password:
    file: ${SECRETS_DIR:-./secrets}/grafana_admin_password
  origin_cert:
    file: ${SECRETS_DIR:-./secrets}/origin_cert.pem
  origin_key:
    file: ${SECRETS_DIR:-./secrets}/origin_key.pem
  admin_password:
    file: ${SECRETS_DIR:-./secrets}/admin_password
