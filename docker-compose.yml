# version: '3.8' # 已过时，移除避免混淆

services:
  mysql:
    image: mysql:8.0
    container_name: video_server_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Cz05180921.
      MYSQL_DATABASE: video_server
      MYSQL_USER: video_user
      MYSQL_PASSWORD: video_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - video_network

  redis:
    image: redis:alpine
    container_name: video_server_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - video_network

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.apiserver
    container_name: video_server_api
    restart: always
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=video_user
      - DB_PASSWORD=video_password
      - DB_NAME=video_server
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    networks:
      - video_network
    volumes:
      - ./storage:/app/storage

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: video_server_scheduler
    restart: always
    depends_on:
      - mysql
    ports:
      - "8089:8089"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=video_user
      - DB_PASSWORD=video_password
      - DB_NAME=video_server
    networks:
      - video_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: video_server_worker
    restart: always
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=video_user
      - DB_PASSWORD=video_password
      - DB_NAME=video_server
    networks:
      - video_network

  transcode-worker:
    build:
      context: .
      dockerfile: Dockerfile.transcode-worker
    container_name: video_server_transcode_worker
    restart: always
    depends_on:
      - redis
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=video_user
      - DB_PASSWORD=video_password
      - DB_NAME=video_server
      - REDIS_ADDR=redis:6379
      - TRANSCODE_CONCURRENCY=2
    networks:
      - video_network
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile.frontend.nginx
    container_name: video_server_frontend
    restart: always
    depends_on:
      - api-server
    ports:
      - "3000:80"
    networks:
      - video_network
    environment:
      - VITE_API_TARGET=http://api-server:8080

  prometheus:
    image: prom/prometheus:v2.40.0
    container_name: video_server_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - video_network

  grafana:
    image: grafana/grafana:9.3.0
    container_name: video_server_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./deploy/monitoring/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./deploy/monitoring/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - video_network

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  video_network:
    driver: bridge