# version: '3.8' # 已过时，移除避免混淆

services:
  mysql:
    image: mysql:8.0
    container_name: video_server_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: video_server
      MYSQL_USER: video_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - video_network

  redis:
    image: redis:alpine
    container_name: video_server_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - video_network

  # 一次性迁移服务：库结构变更的唯一入口（服务启动时不再 AutoMigrate）
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: video_server_migrate
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["up"]
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=video_user
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=video_server
    networks:
      - video_network

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.apiserver
    container_name: video_server_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=video_user
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=video_server
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - STREAM_TOKEN_TTL=${STREAM_TOKEN_TTL:-7200}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - STORAGE_VIDEO_DIR=/app/storage/videos
      - STORAGE_TEMP_DIR=/app/storage/temp
    networks:
      - video_network
    volumes:
      - ./storage:/app/storage

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: video_server_scheduler
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8089:8089"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=video_user
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=video_server
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-30}
      - STORAGE_VIDEO_DIR=/app/storage/videos
      - STORAGE_TEMP_DIR=/app/storage/temp
    volumes:
      - ./storage:/app/storage
    networks:
      - video_network

  transcode-worker:
    build:
      context: .
      dockerfile: Dockerfile.transcode-worker
    container_name: video_server_transcode_worker
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=video_user
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=video_server
      - REDIS_ADDR=redis:6379
      - TRANSCODE_CONCURRENCY=2
      - TRANSCODE_MAX_RETRIES=${TRANSCODE_MAX_RETRIES:-3}
      - TRANSCODE_VISIBILITY_TIMEOUT=${TRANSCODE_VISIBILITY_TIMEOUT:-30m}
      - TRANSCODE_RECLAIM_INTERVAL=${TRANSCODE_RECLAIM_INTERVAL:-1m}
      - STORAGE_VIDEO_DIR=/app/storage/videos
      - STORAGE_TEMP_DIR=/app/storage/temp
    networks:
      - video_network
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile.frontend.nginx
    container_name: video_server_frontend
    restart: always
    depends_on:
      - api-server
    ports:
      # 主机端口可配置：部分 Windows/WSL2 环境会保留 3000/3001 等端口
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - video_network
    environment:
      - VITE_API_TARGET=http://api-server:8080

  prometheus:
    image: prom/prometheus:v2.40.0
    container_name: video_server_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - video_network

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: video_server_alertmanager
    restart: always
    ports:
      - "9093:9093"
    environment:
      - ALERTMANAGER_SMTP_PASSWORD=${ALERTMANAGER_SMTP_PASSWORD:-}
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    # 镜像没有 envsubst：启动时用 sed 把授权码写进临时配置，避免明文入库。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'sed "s|__SMTP_PASSWORD__|$${ALERTMANAGER_SMTP_PASSWORD}|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager'
    networks:
      - video_network

  grafana:
    image: grafana/grafana:9.3.0
    container_name: video_server_grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./deploy/monitoring/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./deploy/monitoring/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - video_network

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  video_network:
    driver: bridge
