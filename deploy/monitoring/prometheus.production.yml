global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: video-api-server
    metrics_path: /metrics
    scrape_interval: 10s
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['api-server:8080']

  - job_name: video-scheduler
    metrics_path: /metrics
    scrape_interval: 30s
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['scheduler:8089']
